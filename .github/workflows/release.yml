name: Release

# Only tags and manual runs. The zip goes straight to the GitHub release:
# no artifacts and no caches, so nothing counts against storage.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm package
      - name: Check tag matches package.json
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Publish release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" out/youtube-pip.zip --prerelease --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
